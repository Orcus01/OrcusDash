name: Feature request
description: Suggest a gameplay or usability improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What player problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior and how a player would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: validation
    attributes:
      label: How would we know it works?
      description: Suggest practical acceptance criteria or playtest observations.
